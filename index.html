<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clash YAML 模板生成器</title>
  <style>
    /* Typography System */
    :root {
      --apple-blue: #0071e3;
      --bg-light: #f5f5f7;
      --text-main: #1d1d1f;
      --text-muted: rgba(0, 0, 0, 0.48);
      --card-bg: #ffffff;
      --card-shadow: rgba(0, 0, 0, 0.22) 3px 5px 30px 0px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-light);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      line-height: 1.47;
      letter-spacing: -0.374px;
      font-size: 17px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1,
    h2,
    h3 {
      font-family: "SF Pro Display", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
      margin: 0;
      font-weight: 600;
    }

    h1 {
      font-size: 56px;
      line-height: 1.07;
      letter-spacing: -0.28px;
      margin-bottom: 8px;
      text-align: center;
    }

    h2 {
      font-size: 40px;
      line-height: 1.10;
      margin-top: 60px;
      margin-bottom: 24px;
    }

    p.subtitle {
      font-size: 21px;
      line-height: 1.19;
      letter-spacing: 0.231px;
      font-weight: 400;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 40px;
    }

    .muted {
      color: var(--text-muted);
      font-size: 14px;
      letter-spacing: -0.224px;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0;
      align-items: center;
    }

    .card {
      background-color: var(--card-bg);
      border: none;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s ease;
    }

    .provider-card {
      display: grid;
      gap: 16px;
    }

    .provider-main-grid {
      display: grid;
      grid-template-columns: minmax(260px, 1.8fr) minmax(190px, 0.8fr) minmax(160px, 0.7fr) auto;
      gap: 12px;
      align-items: start;
    }

    .provider-detail-grid {
      display: grid;
      grid-template-columns: minmax(220px, 0.8fr) minmax(320px, 1.2fr) 1fr;
      gap: 12px;
      align-items: start;
    }

    .provider-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .provider-field input,
    .provider-field select {
      width: 100%;
    }

    .provider-hint {
      min-height: 20px;
    }

    .provider-delete {
      min-height: 53px;
      white-space: nowrap;
    }

    .provider-preview {
      margin-top: -2px;
    }

    @media (max-width: 820px) {
      .provider-main-grid,
      .provider-detail-grid {
        grid-template-columns: 1fr;
      }

      .provider-delete {
        justify-self: start;
      }
    }

    textarea {
      width: 100%;
      min-height: 240px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 16px;
      border-radius: 11px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
      font-size: 14px;
      line-height: 1.4;
      resize: vertical;
    }

    textarea:focus {
      outline: 2px solid var(--apple-blue);
      border-color: transparent;
    }

    input,
    select {
      padding: 12px 16px;
      border: 3px solid rgba(0, 0, 0, 0.04);
      border-radius: 11px;
      background-color: #fafafc;
      font-family: inherit;
      font-size: 17px;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: transparent;
      box-shadow: 0 0 0 2px var(--apple-blue);
      background-color: #ffffff;
    }

    button {
      padding: 8px 15px;
      border: 1px solid transparent;
      border-radius: 8px;
      background-color: var(--apple-blue);
      color: #ffffff;
      font-family: "SF Pro Text", inherit;
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus {
      outline: 2px solid var(--apple-blue);
      outline-offset: 2px;
    }

    /* Secondary buttons (like delete or transparent actions) */
    button.secondary {
      background-color: #fafafc;
      color: rgba(0, 0, 0, 0.8);
      border: 3px solid rgba(0, 0, 0, 0.04);
      border-radius: 11px;
      padding: 6px 14px;
    }

    button.secondary:hover {
      background-color: #ededf2;
    }

    button.pill-link:hover {
      text-decoration: underline;
      background-color: rgba(0, 102, 204, 0.05) !important;
    }

    .top-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 40px 0;
    }

    /* Nav bar glass effect preview */
    .nav-glass {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .nav-glass-title {
      font-size: 12px;
      color: #ffffff;
      font-weight: 400;
      opacity: 0.8;
      letter-spacing: -0.12px;
    }
  </style>
</head>

<body>
  <div class="nav-glass">
    <div class="nav-glass-title">Clash Generator</div>
  </div>

  <div class="container">
    <h1>Clash YAML</h1>
    <p class="subtitle">可视化编辑 Proxy Providers，生成优雅配置</p>

    <textarea id="templateYaml" hidden>mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:10000
experimental:
  ignore-resolve-fail: true
sniffer:
  enable: true
  override-destination: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
      override-destination: true
    QUIC:
      ports: [443, 8443]
      override-destination: true
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - system
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "connect.rom.miui.com"
    - "+.market.xiaomi.com"
    - "+.miwifi.com"
    - "+.ntp.org"
    - "+.u-tools.cn"
    - "+.mediatek.com"
    - "+.cfprefer1.xyz"
    - "+.wetab.link"
    - "+.tyasaka.xyz"
    # QQ
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    # WeChat
    - "localhost.work.weixin.qq.com"
    - "+.weixin.qq.com"
    - "+.wechat.com"
    # Windows
    - "time.windows.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.wpsmail.net"
    - "+.henzanapp.com"
    - "+.pconline.com.cn"

######### 锚点 start #######

# 策略组相关
p: &p {interval: 3600, health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 300}}

######### 锚点 end #######

# ========================================================================
# 代理提供者 (Proxy Providers) 配置区域
# 作用：通过 HTTP 从远端拉取节点列表，方便分类管理不同商家的 VPS 节点。
# 配合上方的锚点 (如 *p) 使用，可以统一管理 health-check 等通用参数。
# ========================================================================

proxy-providers:
  # [1] A节点（日本）
  A-jp:
    <<: *p                  # 继承公共锚点配置 (包含 path, health-check 等)
    type: http              # 获取类型：通过 HTTP 链接拉取
    # ❗️ 必填：请替换为实际订阅链接
    url: https://your_domain/uuid/proxies
    interval: 3600          # 刷新间隔：3600 秒 (1 小时) 自动更新一次节点信息

  # [2] B节点（洛杉矶）
  B-la:
    <<: *p
    type: http
    # ❗️ 必填：请替换为实际订阅链接
    url: https://your_domain/uuid/proxies
    interval: 3600

  # 若需要继续添加其他节点，请复制上述格式并替换名称和链接

proxies:

proxy-groups:
  # ========================================================================
  # 策略组 (Proxy Groups) 配置区域
  # 采用 4 层架构设计，兼顾全局控制、自动测速、按地区分流和单节点精准控制
  # ========================================================================

  # --------------------- 顶层控制组 (第4层) ---------------------
  # 您的总控制器，所有日常使用的分流规则最终都指向这里
  - name: '🚀 节点选择'
    type: select
    proxies:
      # --- 全局自动策略 ---
      - 自动选择-全部
      - 故障转移-全部
      # --- 按地区选择 ---
      - 🇯🇵 日本节点
      - 🇺🇸 美国节点
      # --- 独立VPS选择 (提供最精细控制) ---
      - 🇯🇵 A节点 JP
      - 🇯🇵 B节点 JP
      - 🇺🇸 C节点 LA
      - 🇺🇸 D节点 LA
      - 🇺🇸 E节点 LA
      - 🇺🇸 F节点 NY

  # --------------------- 全局自动策略组 (第3层) ---------------------
  - name: 自动选择-全部
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    # 自动选择范围包含底层的所有 provider (对应 proxy-providers 中的名字)
    use: [A-jp, B-jp, C-la, D-la, E-la, F-ny]

  - name: 故障转移-全部
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    # 故障转移范围包含底层的所有 provider
    use: [A-jp, B-jp, C-la, D-la, E-la, F-ny]

  # --------------------- 按地区聚合策略组 (第2层) ---------------------
  - name: '🇯🇵 日本节点'
    type: select
    proxies: ['🇯🇵 A节点 JP', '🇯🇵 B节点 JP']
    
  - name: '🇺🇸 美国节点'
    type: select
    proxies: ['🇺🇸 C节点 LA', '🇺🇸 D节点 LA', '🇺🇸 E节点 LA', '🇺🇸 F节点 NY']
      
  # --------------------- 独立VPS策略组 (第1层) ---------------------
  # 将 provider 转换为单独的可选策略组，方便在顶层或分流规则中直接选中
  - name: '🇯🇵 A节点 JP'
    type: select
    use: [A-jp]
  - name: '🇯🇵 B节点 JP'
    type: select
    use: [B-jp]
  - name: '🇺🇸 C节点 LA'
    type: select
    use: [C-la]
  - name: '🇺🇸 D节点 LA'
    type: select
    use: [D-la]
  - name: '🇺🇸 E节点 LA'
    type: select
    use: [E-la]
  - name: '🇺🇸 F节点 NY'
    type: select
    use: [F-ny]

  # --------------------- 精简和优化后的分流策略组 ---------------------
  # 针对具体应用的路由规则，默认走'🚀 节点选择'，也可指定特定节点或直连
  - name: '📲 Telegram'
    type: select
    proxies: ['🚀 节点选择', '🇺🇸 美国节点', '🇯🇵 日本节点', '🇺🇸 C节点 LA', '🇺🇸 D节点 LA', '🇺🇸 E节点 LA', '🇺🇸 F节点 NY', '🇯🇵 A节点 JP', '🇯🇵 B节点 JP', DIRECT]
    
  - name: '🔍 Google'
    type: select
    proxies: ['🚀 节点选择', '🇺🇸 美国节点', '🇯🇵 日本节点', '🇺🇸 C节点 LA', '🇺🇸 D节点 LA', '🇺🇸 E节点 LA', '🇺🇸 F节点 NY', '🇯🇵 A节点 JP', '🇯🇵 B节点 JP', DIRECT]
    
  - name: '📹 YouTube'
